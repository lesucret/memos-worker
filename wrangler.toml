name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "66b945e1-1802-43e9-8e09-9f0c9e4bb7c6"
database_name = "notes-db"

[[kv_namespaces]]
binding = "notes-kv"
id = "3ef95d54d4874555804530637658e2e7"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
